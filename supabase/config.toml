# Local CLI identity. The production reference is pinned in the deployment workflow.
project_id = "marketpaperclip"

# Production Auth settings. Preview, then apply (only declared properties change;
# SMTP, providers and other settings stay as configured in the Dashboard):
#   node scripts/supabase-config-push.mjs --diff
#   node scripts/supabase-config-push.mjs
# Never run "supabase config push" directly: it would push the Send Email hook
# without its signing secret (kept in .sites-runtime/send-email-hook.private.env)
# and every authentication email would fail. See docs/COURRIELS_MICROSOFT.md.

# Supabase Auth Send Email hook (signed by Auth, not by a user JWT).
[functions.send-email]
verify_jwt = false
entrypoint = "./functions/send-email/index.ts"

[auth]
site_url = "https://marketpaperclip.com"
# The Site URL host is always allowed; these cover the other origins of the
# same site (with or without a query string such as ?next=/settings?reset=1).
additional_redirect_urls = [
  "https://marketpaperclip.com/api/auth/callback",
  "https://www.marketpaperclip.com/**",
  "https://marketpaperclip.netlify.app/**",
  "https://*--marketpaperclip.netlify.app/**",
  "https://marketpaperclip.murphylexus.chatgpt.site/api/auth/callback",
  "https://marketpaperclip.murphylexus.chatgpt.site/settings",
  "https://marketpaperclip.murphylexus.chatgpt.site/settings?reset=1",
]
enable_signup = true
minimum_password_length = 12

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

[auth.email.template.confirmation]
subject = "MarketPaperclip — Confirmez votre compte / Confirm your account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "MarketPaperclip — Nouveau mot de passe / Reset password"
content_path = "./supabase/templates/recovery.html"

# Authentication emails leave from info@mgminformatique.ca through Microsoft 365
# (function send-email, Entra application "MarketPaperclip Courriels"). The
# templates above stay as the fallback if the hook is ever disabled.
[auth.hook.send_email]
enabled = true
uri = "https://ltommtumsvvqxdknpkfd.supabase.co/functions/v1/send-email"
secrets = "env(SEND_EMAIL_HOOK_SECRET)"
