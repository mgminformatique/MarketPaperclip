name: Deploy Supabase

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketpaperclip-supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_PROJECT_REF: ltommtumsvvqxdknpkfd
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SITE_URL: ${{ vars.MARKETPAPERCLIP_SITE_URL || 'https://marketpaperclip.murphylexus.chatgpt.site' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate deployment safeguards
        run: node --test tests/supabase-deploy.test.mjs
      - name: Check credentials and read existing Auth settings
        run: node scripts/configure-supabase-auth.mjs --plan
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link the designated project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Preview pending migrations
        run: supabase db push --dry-run
      - name: Apply pending migrations
        run: supabase db push --yes
      - name: Configure and verify authentication
        run: node scripts/configure-supabase-auth.mjs --apply
      - name: Verify migration history
        run: supabase migration list
      - name: Deployment summary
        run: |
          echo '### MarketPaperclip — Supabase' >> "$GITHUB_STEP_SUMMARY"
          echo 'Migrations and authentication configuration applied to ltommtumsvvqxdknpkfd.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Runtime keys must also be configured on the website host before accounts are available. See docs/SUPABASE-SETUP.md.' >> "$GITHUB_STEP_SUMMARY"
