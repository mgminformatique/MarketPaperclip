# MarketPaperclip on Netlify: the Vinext Worker build runs as one Node function
# (generated by scripts/netlify-prepare.mjs); dist/client is served by the CDN.
[build]
  command = "npm run build:netlify"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "24"
  # "next" is only a type/API dependency for Vinext; this is not a Next.js build.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[functions]
  # Keep the server chunks as authored ES modules instead of re-bundling them.
  node_bundler = "nft"

# Static assets. HTML and API responses receive their headers (CSP, no-store)
# from worker/index.ts.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000"

[[headers]]
  for = "/art/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
